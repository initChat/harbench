[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harbench"
version = "0.1.0"
description = "HARBench feature-extraction models for Human Activity Recognition"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "einops>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/litchi7777/harbench"

# Map the existing source tree to the import name `harbench` without moving
# any files. Subpackages keep their directories; the `pretrained` directory is
# exposed as `harbench.pretrained` so the bundled mtl weights ship in the wheel.
[tool.setuptools]
packages = [
    "harbench",
    "harbench.data",
    "harbench.models",
    "harbench.utils",
    "harbench.pretrained",
]
include-package-data = true

[tool.setuptools.package-dir]
"harbench" = "src"
"harbench.data" = "src/data"
"harbench.models" = "src/models"
"harbench.utils" = "src/utils"
"harbench.pretrained" = "pretrained"

# Bundle only the mtl weights (other pretrained files are intentionally excluded).
[tool.setuptools.package-data]
"harbench.pretrained" = ["mtl.pth"]
